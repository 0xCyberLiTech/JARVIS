# .pre-commit-config.yaml — JARVIS · 0xCyberLiTech
# Créé 2026-05-14 (chantier dette technique · Action #2)
# Étendu 2026-05-15 (hook pre-push pytest · chantier dette).
#
# Hooks 100% LOCAUX : utilisent ruff + eslint + pytest déjà installés sur la machine.
# Aucun téléchargement réseau (pas de repo distant pre-commit).
# Comportement BLOQUANT : un commit/push est refusé si une vérif échoue.
#
# Installation des hooks (à faire 1 fois après clone) :
#   pre-commit install                   # → installe le hook pre-commit
#   pre-commit install --hook-type pre-push   # → installe le hook pre-push
#
# Bypass exceptionnel : git commit --no-verify · git push --no-verify

repos:
  - repo: local
    hooks:
      # ── Ruff — lint Python (utilise ruff.toml du repo) ──────────
      - id: ruff-check
        name: ruff check (Python)
        entry: python -m ruff check
        language: system
        types: [python]
        require_serial: true
        stages: [pre-commit]

      # ── ESLint — lint JS (utilise eslint.config.js du repo) ─────
      # Couvre TOUS les modules JS applicatifs : 4 historiques (jarvis_main,
      # jarvis_mixing, recorder, voice_print) + les modules extraits dans
      # scripts/static/js/ (refactor JS 2026-05-14/15) + l'UI MOBILE
      # scripts/static/mobile/ (L2 2026-07-18 : le JS mobile était le SEUL
      # exclu du gate alors qu'eslint.config.js `files: scripts/static/**` le
      # couvre — dérive fermée). Aligné avec eslint.config.js — cohérence pre-commit/lint.
      - id: eslint
        name: eslint (JS)
        entry: npx --no-install eslint
        language: system
        files: ^scripts/static/(jarvis_main|jarvis_mixing|recorder|voice_print)\.js$|^scripts/static/js/.+\.js$|^scripts/static/mobile/.+\.js$
        require_serial: true
        stages: [pre-commit]

      # ── Ruff ARBRE ENTIER (stage pre-push) — anti-accumulation dette lint ──
      # Le hook `ruff-check` (pre-commit, types:[python]) ne lint QUE les fichiers TOUCHÉS
      # dans un commit → un .py sale jamais re-touché (ex. tests/ : 63 erreurs accumulées,
      # nettoyées audit dette 07-04) échappe au gate. Ce hook lint scripts/ ET tests/ EN
      # ENTIER à chaque push (always_run) : aucun .py sale ne peut plus être poussé, où qu'il
      # soit. Ferme la CLASSE « lint qui re-dérive dans un répertoire non re-touché ».
      - id: ruff-check-tree
        name: ruff check arbre entier (scripts + tests)
        entry: python -m ruff check scripts tests
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # ── Pytest + GATE couverture — suite tests Python (stage pre-push uniquement) ─
      # Lance la suite unitaire complète avant chaque push (compte LIVE — ne pas figer
      # ici : un nombre codé en dur dérive, cf. audit doctrine 2026-06-30).
      # Bloque si tests rouges OU si la couverture régresse sous le plancher.
      # GATE --cov-fail-under=95 : PLANCHER anti-régression. Le % de couverture RÉEL et le
      # nb de tests sont MESURÉS À CHAQUE RUN — NE PAS les figer ici. (Ce commentaire a
      # LUI-MÊME dérivé : il annonçait « ≈99 % / ~2805 tests », faux — corrigé au titre de
      # la dette #5 « compteurs figés » le 2026-07-15. La marge réelle = couverture mesurée
      # − 95, léger flottement selon l'env : gardes torch/CUDA/ollama.) Aligné/supérieur au
      # gate SOC (88) → l'asymétrie signalée par l'audit 06-24 est levée.
      # Relever le plancher uniquement par action documentée (cf. feedback_scores_marbre).
      - id: pytest
        name: pytest + gate couverture (suite tests Python)
        entry: python -m pytest -q --tb=short --cov=scripts --cov-report=term-missing:skip-covered --cov-fail-under=95
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # ── SUITES DES ORGANES HERMÈS (stage pre-push) — « on ne casse plus un détecteur en vert » ──
      # Ajout 2026-08-01, APRÈS MESURE. Le hook `pytest` ci-dessus n'exécute QUE la suite
      # canonique du produit (`testpaths = ["tests/python"]`, pyproject.toml) ; les organes
      # d'Hermès (scripts/hermes/) portent LEUR PROPRE suite et n'étaient câblés qu'à
      # `audit-all.sh`, lancé à la main. Conséquence MESURÉE : le commit `f93ef5a`
      # (2026-07-31 19:17) est passé VERT AU PUSH tout en cassant la preuve de son propre
      # détecteur d'intégrité mémoire, et le NO-GO a été porté 2 JOURS (rapports audit-all
      # du 2026-07-31_0730, 2026-08-01_0730, 2026-08-01_1022). Seul l'audit quotidien l'a vu.
      # C'est la CLASSE, pas l'instance : tout lot peut rendre rouge un détecteur qu'aucun
      # gate ne regarde — et un détecteur rouge pour une raison bénigne rend une VRAIE
      # régression indiscernable (§2 « un gardien qui crie au loup », §8.8 « un faux NO-GO
      # est pire qu'un silence »). Le `--self-check` de memory-audit (hook guardians-self-check
      # plus bas) ne couvre PAS ce trou : il prouve le détecteur de fraîcheur, pas la suite.
      #
      # ⛔ RÈGLE ZÉRO (§0) : ces suites vivent DANS le produit (scripts/hermes/) — le câblage
      # ne pointe QUE là, jamais vers l'atelier DEV/. Restaurer le seul coffre JARVIS suffit
      # à les rejouer.
      # §3 ZÉRO LISTE ÉCRITE : les dossiers sont DÉRIVÉS de l'arborescence (`find`), jamais
      # énumérés ici — une 3ᵉ suite ajoutée demain est couverte sans que personne y pense.
      # FAIL-CLOSED : si l'énumération ne trouve RIEN, on REFUSE le push au lieu de passer
      # vert sur un gate vacant (une sonde qui ne trouve plus sa cible doit CRIER, pas se taire).
      # `verbose: true` (a11y §5) : pre-commit masque la sortie d'un hook qui réussit — sans
      # ce drapeau, l'opérateur ne verrait NI quelles suites ont tourné, NI si l'une a
      # silencieusement disparu de la liste dérivée. Coût mesuré : ~11 s.
      - id: hermes-suites
        name: suites pytest des organes Hermès (les détecteurs du produit gardent leurs dents)
        entry: bash -c 'set -u; dirs=$(find scripts/hermes -name "test_*.py" -not -path "*/__pycache__/*" -exec dirname {} \; | sort -u); if [ -z "$dirs" ]; then echo "NO-GO -- aucune suite pytest trouvee sous scripts/hermes/ -- ce gate serait VACANT"; exit 1; fi; rc=0; for d in $dirs; do echo "--- suite Hermes >> $d"; ( cd "$d" && python -m pytest -q --no-header ) || rc=1; done; if [ $rc -ne 0 ]; then echo "NO-GO -- au moins un detecteur Hermes est ROUGE -- push refuse"; fi; exit $rc'
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]

      # ── Gardiens DOCTRINE (stage pre-push) — anti-dérive LLM-config + termes périmés doc ──
      # Ajout 2026-06-24 (re-audit doctrine F4) : ces gardiens ne tournaient QUE dans audit-all
      # (manuel) → une dérive (modèle LLM incohérent / hardcodé UI, « phi4 » ré-apparu dans la doc)
      # passait le push sans alerte. On les gate au pre-push : statiques, 100% LOCAUX, 0 réseau.
      # Source unique : les outils vivent dans DEV/TOOLS (chemin relatif depuis la racine JARVIS,
      # où pre-commit s'exécute). doc-drift cible `docs` (= JARVIS/docs, aligné sur audit-all §7).
      - id: jarvis-llm-audit
        name: jarvis-llm-audit (cohérence config LLM, anti-hardcode)
        entry: python ../DEV/TOOLS/jarvis-llm-audit/jarvis-llm-audit.py --no-ollama
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: jarvis-llm-registry-audit
        name: jarvis-llm-registry-audit (registre source-unique modes→LLM, anti-hardcode .py/.js)
        entry: python ../DEV/TOOLS/jarvis-llm-registry-audit/jarvis-llm-registry-audit.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: jarvis-persona-audit
        name: jarvis-persona-audit (persona source-unique — messages temporels, tutoiement, anti-hardcode)
        entry: python ../DEV/TOOLS/jarvis-persona-audit/jarvis-persona-audit.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: jarvis-read-denylist-guard
        name: jarvis-read-denylist-guard (route lisant un fichier-requête → denylist is_sensitive_read obligatoire)
        entry: python ../DEV/TOOLS/jarvis-read-denylist-guard/jarvis-read-denylist-guard.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: doc-drift-lint-jarvis
        name: doc-drift-lint (termes périmés — JARVIS/docs)
        entry: bash scripts/hermes/doc-drift-lint/doc-drift-lint.sh docs
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # ── Gardiens ACCESSIBILITÉ (stage pre-push) — règle ABSOLUE du projet ──
      # Ajout 2026-06-30 (audit doctrine F1) : ces 2 gardiens ne tournaient QUE dans
      # audit-all (§12 + §24, manuel) → une régression a11y (contraste sous-plancher,
      # fonte < 10px, canvas/contrôle sans nom accessible, JS-clic non clavier) passait
      # le push sans alerte. On les gate au pre-push : statiques, 100% LOCAUX, 0 réseau.
      # scan-inline-a11y : couleurs/alphas/fontes (inline JS + CSS). jarvis-a11y-audit :
      # nav tabs/panels + labels (I4) + data-action clavier (I5) + JS-clic clavier (I6).
      - id: scan-inline-a11y
        name: scan-inline-a11y (contraste/fonte — accessibilité)
        entry: python ../DEV/TOOLS/scan-inline-a11y/scan-inline-a11y.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: jarvis-a11y-audit
        name: jarvis-a11y-audit (nav/labels/clavier — accessibilité)
        entry: python ../DEV/TOOLS/jarvis-a11y-audit/jarvis-a11y-audit.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # ── Gardiens SÉCURITÉ (stage pre-push) — anti-SSRF + anti-exfiltration ──
      # Ajout 2026-06-30 (audit doctrine HAUTE) : ces gardiens sécurité ne tournaient QU'en
      # audit-all manuel → une régression (passerelle web SSRF contournée, secret non
      # caviardé par redact_secrets) passait le push sans alerte. On les gate au pre-push :
      # statiques, 100% LOCAUX, 0 réseau. web-audit = porte web gouvernée (allowlist, 0 appel
      # direct, journal). secret-redact-audit = redact_secrets attrape la CLASSE de secrets.
      - id: web-audit
        name: web-audit (passerelle web gouvernée — anti-SSRF)
        entry: python ../DEV/TOOLS/web-audit/web-audit.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: secret-redact-audit
        name: secret-redact-audit (caviardage secrets — anti-exfiltration)
        entry: python ../DEV/TOOLS/secret-redact-audit/secret-redact-audit.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # ── VERROU DE SILENCE E2E (stage pre-push) — « un test ne fait pas parler la production » ──
      # Ajout 2026-07-22, APRÈS incident MESURÉ. mobile-emergency-render.spec.js interceptait
      # /api/mobile/** mais PAS /api/tts : elle a fait prononcer 3 fois à voix haute (tts.log,
      # source=mobile, 17:50:06 / 18:04:21 / 18:06:43) « ARRÊT COMPLET TERMINÉ — VOUS POUVEZ
      # COUPER LE COURANT » — l'écran d'urgence ORAGE que un PROCHE du foyer utilise — pendant que
      # les 4 VMs tournaient. CLASSE, pas instance : 19 des 25 specs ne citent même pas /api/tts.
      # Le verrou lui-même est STRUCTUREL (e2e-silence/silence-proxy.cjs en `use.proxy` : le seul
      # point de passage commun à toutes les specs, présentes ET futures). Ce hook PROUVE qu'il
      # est entier. Il est placé AVANT le gate visuel : on ne lance pas des specs contre la
      # production sans avoir prouvé qu'elles resteront muettes.
      - id: jarvis-e2e-silence-guard
        name: verrou de silence E2E (aucune spec ne peut faire parler JARVIS)
        entry: python scripts/hermes/jarvis-e2e-silence-guard/jarvis-e2e-silence-guard.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]

      # ── VIEWPORT DES SPECS MOBILES (stage pre-push) — « on ne teste pas un écran qui n'existe pas » ──
      # Ajout 2026-07-22, APRÈS mesure. 9 tests étaient ROUGES depuis le 2026-07-18 sans que
      # personne ne les nomme — donc le GATE VISUEL ci-dessous était NO-GO en permanence, y compris
      # sur les 3 tests de l'écran d'ARRÊT D'URGENCE. Motif unique : les specs n'avaient aucun
      # viewport, héritaient de Desktop Chrome 1280x720 = PAYSAGE, et en paysage la nav du bas est
      # MASQUÉE PAR CONCEPTION (décision l operateur 2026-07-17, « accueil paysage PARTOUT »).
      # Le défaut était dans la SPEC (elle pilotait un téléphone dans une fenêtre de bureau), pas
      # dans le produit. Ce hook est placé AVANT le gate visuel : il rend un verdict STATIQUE qui
      # NOMME le fichier et la ligne, au lieu de laisser l operateur lire 9 timeouts de 30 s.
      # ⛔ Il verrouille aussi la voie MALHONNÊTE : faire verdir en modifiant mobile.css aurait
      #    cassé un invariant ratifié et vert (mobile-paysage-partout.spec.js) — blanchiment (§8).
      - id: jarvis-e2e-viewport-guard
        name: viewport des specs mobiles (portrait obligatoire pour cliquer la nav)
        entry: python scripts/hermes/jarvis-e2e-viewport-guard/jarvis-e2e-viewport-guard.py
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]

      # ── GATE VISUEL (stage pre-push) — le RENDU RÉEL des écrans, prouvé par une machine ──
      # Ajout 2026-07-14. Des specs Playwright prouvent ce que les ÉCRANS DISENT : la tuile SANTÉ
      # MÉMOIRE et l'UI mobile d'ARRÊT D'URGENCE (celle qui dit à un proche du foyer si elle peut
      # couper le courant). Elles n'étaient câblées à AUCUN gate → elles ne tournaient que si un
      # humain y pensait, et « un test qu'un humain doit penser à lancer finit par ne plus être
      # lancé ». Ici le rattrapage visuel n'est pas une option : rien ne remplace le gate.
      #
      # ⚠ CE HOOK NE BLOQUE JAMAIS SUR L'ABSENCE DE JARVIS. Playwright exige un JARVIS vivant :
      # le câbler naïvement casserait le push dès que JARVIS est éteint → l operateur contournerait le
      # gate, et un gate contourné est un gate MORT (doctrine §2). Donc : JARVIS éteint → le gate
      # est SAUTÉ, le push passe, et le saut est COMPTÉ (état persistant). JARVIS vivant → les
      # specs tournent et un échec RÉEL bloque le push. Les sauts sont RATTRAPÉS par JARVIS
      # LUI-MÊME — AUCUNE tâche planifiée (décision de l operateur, 2026-07-14 : « ma machine n'est pas
      # allumée en permanence » ; une tâche hebdo sur une machine éteinte ne tourne JAMAIS, elle
      # dormirait comme les gardiens qu'elle doit réveiller). Deux déclencheurs : au DÉMARRAGE
      # (thread bootstrap.threads.boot_maintenance) ET en COURS DE ROUTE (thread
      # bootstrap.threads.maintenance_loop, période DÉRIVÉE) — sans le second, un JARVIS allumé
      # des semaines ne re-vérifierait jamais rien. L'invariant de fraîcheur `gate_visuel`
      # (memory-audit) surveille le gate, et `boucle_maintenance` surveille la BOUCLE elle-même
      # (battement de cœur) : si elle meurt, ÇA CRIE.
      # `verbose: true` = NON NÉGOCIABLE (a11y §5). pre-commit MASQUE la sortie d'un hook qui
      # réussit : sans ce drapeau, un gate SAUTÉ afficherait un simple « Passed » et l operateur ne
      # saurait JAMAIS que le mécanisme dort (ni depuis combien de temps). L'état du circuit doit
      # être ÉNONCÉ en toutes lettres à chaque push — un voyant qu'il faut deviner n'existe pas.
      - id: jarvis-visual-gate
        name: gate visuel (rendu réel des écrans — sauté si JARVIS est éteint, le saut est compté)
        entry: python scripts/hermes/jarvis-visual-gate/jarvis-visual-gate.py --run
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]

      # ── ANTI-COMPLAISANCE (stage pre-push) — le verrou §32 voyage avec le push ──
      # Ajout 2026-06-30 (audit doctrine) : le --self-check fault-injection (PROUVE qu'un
      # détecteur n'est pas neutralisé par une exclusion sur-mesure) ne tournait QU'en
      # audit-all manuel → un gardien neutralisé passait le push. La doctrine 06-24 acte
      # qu'un gardien neutralisé est « PIRE que pas de gardien ». On exécute donc le
      # self-check des 3 gardiens DÉJÀ gatés ici (a11y ×2 + llm-audit). Échec = push bloqué.
      - id: guardians-self-check
        name: self-check gardiens (anti-complaisance fault-injection)
        entry: bash -c 'for t in scan-inline-a11y/scan-inline-a11y jarvis-a11y-audit/jarvis-a11y-audit jarvis-llm-audit/jarvis-llm-audit jarvis-llm-registry-audit/jarvis-llm-registry-audit jarvis-persona-audit/jarvis-persona-audit secret-redact-audit/secret-redact-audit jarvis-read-denylist-guard/jarvis-read-denylist-guard; do python "../DEV/TOOLS/$t.py" --self-check || exit 1; done; for t in jarvis-visual-gate/jarvis-visual-gate memory-audit/memory-audit jarvis-e2e-silence-guard/jarvis-e2e-silence-guard jarvis-e2e-viewport-guard/jarvis-e2e-viewport-guard; do python "scripts/hermes/$t.py" --self-check || exit 1; done; bash scripts/hermes/doc-drift-lint/doc-drift-lint.sh --self-check || exit 1; powershell -NoProfile -ExecutionPolicy Bypass -File ../DEV/TOOLS/jarvis-watchdog-audit/jarvis-watchdog-audit.ps1 -SelfCheck || exit 1'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # ── Gate SSH read-only (allowlist fail-closed) — anti-RCE root du tool-calling LLM ──
      # Incident 2026-07-04 : le gate SSH était une DENYLIST → RCE root via injection de prompt (7 red-teams
      # indépendants). Réécrit en ALLOWLIST fail-closed + méta-garde-fou (tout verbe doit être classé
      # pur-lecture XOR multiplexeur-gaté). `--self-check` exécute le corpus (153 attaques : LOLBins,
      # assemblage, pipe→interpréteur, exfil DNS, sous-commandes write) + le méta-garde-fou de classification.
      # Un gate RCE ne doit JAMAIS re-dériver → gaté à CHAQUE push (avant : audit-all manuel seulement).
      - id: jarvis-ssh-gate-guard
        name: jarvis-ssh-gate-guard (allowlist SSH read-only — anti-RCE, corpus red-team + méta-garde-fou)
        entry: python ../DEV/TOOLS/jarvis-ssh-gate-guard/jarvis-ssh-gate-guard.py --self-check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
      # ── Confinement exec root (audit indépendant Q2, 2026-07-04) ──
      # /api/code/exec + MCP jarvis_code_exec EXÉCUTENT du code root sur la VM de dev jetable. Risque résiduel
      # (injection de prompt → code arbitraire) ASSUMÉ car la cible est une VM dev JETABLE SANS PIVOT.
      # Ce gardien verrouille la condition d'acceptation : la cible reste la VM de dev jetable, jamais une IP prod
      # (I3) ni en dur (I2). Sécurité-critique (blast-radius) → gaté à CHAQUE push. --self-check = live.
      - id: jarvis-code-exec-confinement-guard
        name: jarvis-code-exec-confinement-guard (exec root confiné à la VM de dev jetable)
        entry: python ../DEV/TOOLS/jarvis-code-exec-confinement-guard/jarvis-code-exec-confinement-guard.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      # ── BARRIÈRE DE PUBLICATION (stage pre-push) — « rien ne part en public sans preuve » ──
      # Ajout 2026-08-01, sur DÉCISION DE MARC, APRÈS MESURE. `vitrine-push-hook --status`
      # rendait 24/25 : sur les 25 dépôts PUBLICS du workspace (surface dérivée de `git remote`),
      # JARVIS était le SEUL dont un `git push` partait SANS barrière de publication. Motif : il a
      # déjà ce pre-push riche, qu'on n'écrase PAS — et le câbler DEPUIS `DEV/` était BLOQUÉ, à
      # raison, par le gardien actif du projet (R4-dev-coupling) : un gate PRODUIT versionné qui
      # référence l'atelier viole la Règle Zéro. Le contournement (`|| true`, exception) aurait été
      # un BLANCHIMENT (§8) : on éteignait l'alarme, pas le feu.
      #
      # ⛔ RÈGLE ZÉRO (§0) — CE QUI A CHANGÉ : le gardien a DÉMÉNAGÉ dans le produit
      # (`scripts/hermes/jarvis-public-doc-guard/`, copie UNIQUE — `DEV/` ne le garde PAS). Ce
      # câblage ne pointe donc QUE dans JARVIS : restaurer le seul coffre suffit à rejouer cette
      # barrière. C'est exactement le motif des hooks `jarvis-visual-gate` / `jarvis-e2e-*`.
      #
      # CE QU'IL PROUVE, dans cet ordre (le self-check D'ABORD — doctrine V1, anti-complaisance :
      # un détecteur neutralisé rendrait un VERT MENSONGER, et « un gardien qu'on n'a pas essayé de
      # casser ne garde rien ») puis le RUN LIVE :
      #   I1 — aucune IP privée CONCRÈTE dans un .md tracké de la vitrine JARVIS ;
      #   I2 — aucun IDENTIFIANT NOMINATIF (X:\Users\<nom>, /home/<nom>) dans les fichiers texte
      #        trackés des dépôts PUBLICS du workspace (surface DÉRIVÉE de `git remote`).
      # PORTÉE ASSUMÉE ET DITE : I2 scanne TOUTES les vitrines, pas seulement celle qu'on pousse —
      # une fuite dormant ailleurs bloque donc aussi ce push. Ce n'est PAS un faux positif : un
      # dépôt public est indexé POUR TOUJOURS, et le message NOMME le fichier et la ligne fautifs.
      # `verbose: true` (a11y §5) : pre-commit MASQUE la sortie d'un hook qui
      # réussit — sans ce drapeau, on ne saurait ni ce qui a été scanné, ni combien.
      # ⛔ `--no-verify` n'est PAS le chemin : faire taire cette barrière est un BLANCHIMENT (§8).
      - id: jarvis-public-doc-guard
        name: barrière de publication (ni IP interne ni identifiant nominatif ne part en vitrine)
        entry: bash -c 'python scripts/hermes/jarvis-public-doc-guard/jarvis-public-doc-guard.py --self-check -Quiet && python scripts/hermes/jarvis-public-doc-guard/jarvis-public-doc-guard.py'
        language: system
        pass_filenames: false
        always_run: true
        verbose: true
        stages: [pre-push]

      # ── RÈGLE ZÉRO — la frontière du produit (2026-07-14) ──
      # Aucun fichier de JARVIS/scripts/** ne dépend d'un outil de l'ATELIER (DEV/) ni d'un dossier
      # frère non déclaré, sur un chemin ATTEIGNABLE À L'EXÉCUTION. C'est l'invariant qui garantit
      # que JARVIS RESSUSCITE SEUL après un sinistre (restaurer le coffre suffit). Fail-closed :
      # une seule dépendance vers DEV/ hors allowlist justifiée → push bloqué. Scanne .py/.js ET
      # .ps1/.sh. Le --self-check (injection de fautes, incl. la classe PowerShell) est joint pour
      # prouver, à chaque push, que le détecteur a encore des dents (anti-complaisance §8).
      - id: jarvis-prod-boundary-guard
        name: jarvis-prod-boundary-guard (RÈGLE ZÉRO — le produit ne dépend pas de l'atelier)
        entry: bash -c 'python ../DEV/TOOLS/jarvis-prod-boundary-guard/jarvis-prod-boundary-guard.py --self-check && python ../DEV/TOOLS/jarvis-prod-boundary-guard/jarvis-prod-boundary-guard.py -Quiet'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
